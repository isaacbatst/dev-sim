<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Dev Task Chef">
  <title>Dev Task Chef</title>
  <!-- Identidade devOS (globals.css, tema graveyard): fundo #0e1016 (bg), cursor
       #f5a623 (ambar = "a tecla de agora"), linha #98a0b2 (ink-dim clareado).
       Cursor de bloco no fim da linha: terminal/editor. Duas formas so, gordas e
       com pouca margem, pra sobreviver ao downscale de 16px (onde traco fino
       some). ATENCAO: nada de hifen duplo aqui dentro (quebra o XML). -->
  <rect width="32" height="32" rx="7" fill="#0e1016" />
  <rect x="5" y="14" width="10" height="4" rx="2" fill="#98a0b2" />
  <rect x="18.5" y="6.5" width="8.5" height="19" rx="2.25" fill="#f5a623" />
</svg>
